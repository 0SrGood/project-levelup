<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect x="0" y="0" width="960" height="600" rx="0" fill="#20242b" stroke="none"/><rect x="0" y="0" width="960" height="58" rx="0" fill="#171b21" stroke="none"/><rect x="24" y="22" width="14" height="14" rx="3" fill="#a89bbd" stroke="none"/><text x="52" y="36" fill="#e3e7ed" font-family="Arial,sans-serif" font-size="21" font-weight="600">Programação em Luau</text><text x="721" y="35" fill="#7e8794" font-family="Arial,sans-serif" font-size="16" font-weight="400">Projeto · Level Up</text><path d="M0 58L960 58" stroke="#343a43" stroke-width="1" fill="none"/><rect x="0" y="58" width="960" height="48" rx="0" fill="#22262e" stroke="none"/><rect x="22" y="66" width="163" height="40" rx="4" fill="#30343d" stroke="none"/><text x="42" y="93" fill="#e2e4eb" font-family="Arial,sans-serif" font-size="19" font-weight="400">Script.luau</text><text x="745" y="91" fill="#a79abb" font-family="Arial,sans-serif" font-size="17" font-weight="400">Luau</text><rect x="0" y="106" width="960" height="410" rx="0" fill="#20232b" stroke="none"/><text x="27" y="153" fill="#646b78" font-family="Arial,sans-serif" font-size="18" font-weight="400">1</text><text x="77" y="153" font-family="monospace" font-size="21" fill="#c5afd8" xml:space="preserve">local part = workspace.Part</text><text x="27" y="196" fill="#646b78" font-family="Arial,sans-serif" font-size="18" font-weight="400">2</text><text x="77" y="196" font-family="monospace" font-size="21" fill="#aaa" xml:space="preserve"></text><text x="27" y="239" fill="#646b78" font-family="Arial,sans-serif" font-size="18" font-weight="400">3</text><text x="77" y="239" font-family="monospace" font-size="21" fill="#c6d2e0" xml:space="preserve">part.Touched:Connect(function(hit)</text><text x="27" y="282" fill="#646b78" font-family="Arial,sans-serif" font-size="18" font-weight="400">4</text><text x="77" y="282" font-family="monospace" font-size="21" fill="#c6d2e0" xml:space="preserve">    local player = hit.Parent</text><text x="27" y="325" fill="#646b78" font-family="Arial,sans-serif" font-size="18" font-weight="400">5</text><text x="77" y="325" font-family="monospace" font-size="21" fill="#c6d2e0" xml:space="preserve">    if player:FindFirstChild("Humanoid") then</text><text x="27" y="368" fill="#646b78" font-family="Arial,sans-serif" font-size="18" font-weight="400">6</text><text x="77" y="368" font-family="monospace" font-size="21" fill="#d7c4a1" xml:space="preserve">        part.BrickColor = BrickColor.new("Bright yellow")</text><text x="27" y="411" fill="#646b78" font-family="Arial,sans-serif" font-size="18" font-weight="400">7</text><text x="77" y="411" font-family="monospace" font-size="21" fill="#c5afd8" xml:space="preserve">    end</text><text x="27" y="454" fill="#646b78" font-family="Arial,sans-serif" font-size="18" font-weight="400">8</text><text x="77" y="454" font-family="monospace" font-size="21" fill="#c5afd8" xml:space="preserve">end)</text><path d="M0 516L960 516" stroke="#3d444e" stroke-width="1" fill="none"/><text x="26" y="551" fill="#d7dbe4" font-family="Arial,sans-serif" font-size="19" font-weight="600">Saída</text><text x="26" y="584" fill="#9098a7" font-family="Arial,sans-serif" font-size="17" font-weight="400">Pronto para testar o script.</text></svg>